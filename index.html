<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LUCOP Pharmacy Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* LUCOP PHARMACY PLAYGROUND
   Concept: the student sits at a simulated workstation. A dark desk bezel
   frames two practice systems, each with its own visual era so switching
   software FEELS different — that's the transferable lesson.
   Signature move: the gold Preceptor panel rides along the right edge. */
:root{--desk:#0b0e13;--bez:#1e2531;--ink:#c7d3e2;--dim:#7b8ca3;
--lu:#8a1538;--lu2:#b8365c;--gold:#c8a04a;
--ok:#1f7a4d;--okb:#e6f4ec;--wn:#b87503;--wnb:#fdf3df;--bd:#b3122e;--bdb:#fcebee;--inf:#1a4e8f;--infb:#e8f0fb;--r:4px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,-apple-system,Segoe UI,sans-serif;font-size:14px;line-height:1.45;color:#e8eef5;
background:radial-gradient(ellipse at 50% 0%,#1a2130,#07090d 70%);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.hide{display:none!important}
.sim{background:repeating-linear-gradient(135deg,#f6d365 0 14px,#f0bf43 14px 28px);color:#3d2a00;
font-size:10.5px;font-weight:800;letter-spacing:.14em;text-align:center;padding:5px;text-transform:uppercase;flex:none}
/* taskbar */
.tb{background:linear-gradient(180deg,#161d28,#0f141c);border-bottom:1px solid #2a3443;display:flex;
align-items:center;gap:13px;padding:0 14px;height:46px;flex:none}
.mk{width:28px;height:28px;border-radius:5px;background:linear-gradient(135deg,var(--lu),var(--lu2));
display:grid;place-items:center;font-weight:800;font-size:11px;color:#fff}
.tb b{font-size:14px}.tb small{display:block;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:600}
.sys{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink);background:#1d2635;
border:1px solid #2e3a4c;border-radius:20px;padding:4px 12px}
.lamp{width:7px;height:7px;border-radius:50%;background:#45d483;box-shadow:0 0 7px #45d483}
.rgt{margin-left:auto;display:flex;align-items:center;gap:9px}
.tbtn{font-size:11.5px;padding:6px 11px;border-radius:var(--r);border:1px solid #2e3a4c;color:var(--ink);background:#1a2230;transition:.15s}
.tbtn:hover{background:#243043;color:#fff}
.tbtn.dz:hover{background:#3a1520;border-color:#7a2238;color:#ffc9d4}
.clk{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--dim);padding-left:9px;border-left:1px solid #2a3443}
.av{width:26px;height:26px;border-radius:50%;background:var(--gold);color:#2a2000;display:grid;place-items:center;font-weight:800;font-size:10px}
.stage{flex:1;display:flex;overflow:hidden;min-height:0}
.scr{flex:1;overflow:auto}
/* login */
.lg{min-height:100%;display:grid;place-items:center;padding:40px 20px}
.lgc{width:100%;max-width:460px;background:linear-gradient(180deg,#19202c,#121822);border:1px solid #2a3443;
border-radius:10px;padding:34px;box-shadow:0 30px 70px rgba(0,0,0,.6)}
.lgm{width:54px;height:54px;border-radius:11px;background:linear-gradient(135deg,var(--lu),var(--lu2));
display:grid;place-items:center;font-weight:800;font-size:17px;color:#fff;margin-bottom:18px}
.lgc h1{font-size:25px;font-weight:800;letter-spacing:-.025em;line-height:1.15}
.lgc h1 span{color:var(--gold)}
.tag{color:var(--dim);font-size:13px;margin-top:7px;line-height:1.6}
.fld{margin-top:16px}
.fld label{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700;margin-bottom:6px}
.fld input{width:100%;background:#0c1017;border:1px solid #2e3a4c;color:#fff;padding:11px 13px;border-radius:var(--r);font-size:14px}
.fld input:focus{border-color:var(--gold);outline:none}
.bp{width:100%;margin-top:21px;background:linear-gradient(180deg,var(--lu2),var(--lu));color:#fff;
font-weight:700;padding:13px;border-radius:var(--r);font-size:14.5px;border:1px solid #9d2044}
.bp:hover{filter:brightness(1.12)}
.fine{margin-top:17px;font-size:11px;color:#5e6e84;line-height:1.65;border-top:1px solid #232c3a;padding-top:13px}
/* lobby */
.lob{max-width:1060px;margin:0 auto;padding:36px 24px 60px}
.eyb{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:700}
.lob h1{font-size:33px;font-weight:800;letter-spacing:-.03em;margin-top:9px;line-height:1.1}
.lob>p{color:#8fa0b8;font-size:14.5px;margin-top:11px;max-width:66ch;line-height:1.65}
.stats{display:flex;gap:26px;flex-wrap:wrap;margin-top:20px;padding:16px 0;border-top:1px solid #222b38;border-bottom:1px solid #222b38}
.st b{display:block;font-family:'IBM Plex Mono',monospace;font-size:24px;color:#fff}
.st span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#6d7e95;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:18px;margin-top:24px}
.card{background:linear-gradient(180deg,#19202c,#131924);border:1px solid #28313f;border-radius:9px;overflow:hidden;transition:.18s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);border-color:#3d4a5e;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.spine{height:5px}
.cin{padding:19px;display:flex;flex-direction:column;flex:1}
.cde{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.14em;color:#6d7e95;font-weight:600}
.cin h3{font-size:19px;font-weight:700;letter-spacing:-.02em;margin-top:5px}
.csub{font-size:12px;color:#8fa0b8;margin-top:2px}
.cds{font-size:12.5px;color:#9aabc2;line-height:1.65;margin-top:12px;flex:1}
.sk{margin-top:13px;padding-top:13px;border-top:1px solid #242d3b}
.sk h4{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#6d7e95;font-weight:700;margin-bottom:7px}
.sk li{font-size:12px;color:#9aabc2;list-style:none;padding-left:14px;position:relative;line-height:1.7}
.sk li::before{content:"›";position:absolute;left:2px;color:var(--gold);font-weight:700}
.pills{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}
.pl{font-size:10px;font-weight:700;padding:3px 9px;border-radius:11px;background:#232d3c;color:#9fb3cc;border:1px solid #2f3b4d}
.pl.d{background:#14301f;color:#5cd68f;border-color:#1f5435}
.lnc{margin-top:16px;width:100%;padding:11px;border-radius:var(--r);font-weight:700;font-size:13.5px;background:#f1f5fa;color:#101722;transition:.15s}
.lnc:hover{background:#fff}
.note{font-size:11px;color:#7f90a7;line-height:1.6;margin-top:10px}
/* window */
.win{display:flex;flex-direction:column;height:100%;min-height:0}
.wbar{display:flex;align-items:center;gap:10px;padding:7px 12px;flex:none;background:linear-gradient(180deg,#232c3a,#1a222e);border-bottom:1px solid #0d1219}
.dots{display:flex;gap:6px}.dots i{width:11px;height:11px;border-radius:50%;display:block}
.wtt{font-size:11.5px;color:#9fb0c6;font-weight:600}
.wbody{flex:1;display:flex;min-height:0}
.app{flex:1;overflow:auto;min-width:0}
/* preceptor */
.pc{width:328px;flex:none;background:linear-gradient(180deg,#141b26,#0f141d);border-left:1px solid #28313f;display:flex;flex-direction:column;overflow:auto}
.pc.col{width:42px}
.pch{padding:12px 13px;border-bottom:1px solid #242d3b;display:flex;align-items:center;gap:9px}
.pch h2{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:800;flex:1}
.pcb{padding:13px}
.sb{text-align:left;padding:11px 12px;border:1px solid #2b3545;border-radius:var(--r);background:#18202c;transition:.15s;width:100%;margin-bottom:8px}
.sb:hover{border-color:var(--gold);background:#1e2736}
.sb strong{display:block;font-size:13px;color:#e8eef5}
.sb span{font-size:11px;color:#7f90a7}
.sb .bar{height:3px;background:#242d3b;border-radius:3px;margin-top:8px;overflow:hidden;display:block}
.sb .bar i{display:block;height:100%;background:var(--ok)}
.drow{display:flex;gap:5px;margin:12px 0}
.drow i{flex:1;height:4px;border-radius:3px;background:#2a3443;display:block}
.drow i.p{background:var(--ok)}.drow i.f{background:var(--bd)}.drow i.n{background:var(--gold)}
.tc{background:#1a2230;border:1px solid #2b3545;border-radius:6px;padding:14px}
.tn{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;color:#7f90a7;font-weight:700}
.kd{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.1em;padding:2px 7px;border-radius:9px;margin-left:7px}
.k1{background:#15314f;color:#7cb8f5}.k2{background:#3a2a10;color:#f0c068}.k3{background:#1c3b2c;color:#6ed79f}
.tq{font-size:13.5px;line-height:1.6;margin-top:10px;color:#eaf1f8}
.tc input[type=text]{width:100%;margin-top:12px;background:#0c1017;border:1px solid #2e3a4c;color:#fff;
padding:10px 12px;border-radius:var(--r);font-family:'IBM Plex Mono',monospace;font-size:13px}
.chs{display:grid;gap:7px;margin-top:12px}
.ch{text-align:left;padding:10px 12px;border:1px solid #2e3a4c;border-radius:var(--r);background:#0f1520;
font-size:12.5px;line-height:1.5;color:#cfdbe9;transition:.13s}
.ch:hover{border-color:var(--gold);background:#17202d}
.ch.s{border-color:var(--gold);background:#241e10;color:#fff}
.acts{display:flex;gap:8px;margin-top:12px}
.acts button{flex:1;padding:10px;border-radius:var(--r);font-weight:700;font-size:12.5px}
.bchk{background:var(--gold);color:#241c00}.bchk:hover{filter:brightness(1.1)}
.bhnt{background:#222b3a;color:#9fb0c6;border:1px solid #2e3a4c;flex:0 0 72px!important}
.fb{margin-top:12px;border-radius:6px;padding:12px;font-size:12.5px;line-height:1.65}
.fb.g{background:#0f2b1d;border:1px solid #1f5435;color:#9fe9c0}
.fb.b{background:#2e1118;border:1px solid #5e1f2e;color:#f3b1bf}
.fb.h{background:#2b2410;border:1px solid #5a4a16;color:#f0d79a}
.fb strong{display:block;margin-bottom:5px;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.why{display:block;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.12);color:#d8e6f2;font-style:italic}
.pf{margin-top:13px;padding-top:12px;border-top:1px solid #242d3b;display:flex;gap:8px}
.pf button{flex:1;font-size:11px;padding:8px;border-radius:var(--r);background:#1b2431;border:1px solid #2b3545;color:#8fa0b8}
.pf button:hover{background:#243044;color:#cfdbe9}
/* ===== SYSTEM 1: RxONE (dated teal terminal) ===== */
.rx{background:#c8ccc4;color:#101210;min-height:100%;display:flex;flex-direction:column}
.rxm{background:#008080;color:#fff;display:flex;align-items:center;font-size:12px;border-bottom:2px solid #004f4f}
.rxm .mi{padding:7px 14px;border-right:1px solid #0a9c9c;font-weight:600}
.rxm .mi:hover{background:#0a9c9c}
.rxm .lg2{background:#004f4f;padding:7px 15px;font-weight:800;letter-spacing:.1em}
.rxm .who{margin-left:auto;padding:7px 14px;font-family:'IBM Plex Mono',monospace;font-size:11px;background:#004f4f}
.rxmain{flex:1;padding:13px;overflow:auto}
.pnl{background:#d8dcd4;border:2px solid #fff;border-right-color:#808478;border-bottom-color:#808478;margin-bottom:12px}
.pnl>h3{background:linear-gradient(180deg,#006a6a,#004f4f);color:#fff;font-size:11px;font-weight:700;
letter-spacing:.14em;text-transform:uppercase;padding:6px 11px}
.pb{padding:12px}
table.t{width:100%;border-collapse:collapse;background:#fff;font-size:12.5px}
table.t th{background:#b4bab0;text-align:left;padding:6px 9px;font-size:10px;letter-spacing:.1em;
text-transform:uppercase;border:1px solid #969c92;font-weight:700;color:#1b2420}
table.t td{padding:6px 9px;border:1px solid #d2d6cf;vertical-align:top}
table.t tbody tr[data-rx],table.t tbody tr[data-pt]{cursor:pointer}
table.t tbody tr[data-rx]:hover,table.t tbody tr[data-pt]:hover{background:#cfe6e6}
.s{display:inline-block;font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:3px;white-space:nowrap}
.sw{background:#fff2cc;color:#8a6300;border:1px solid #e0c060}
.sr{background:#ffd9df;color:#8c0b23;border:1px solid #e08b9b}
.sh{background:#e2d9f7;color:#4b2f93;border:1px solid #b5a3e8}
.sd{background:#d4f0de;color:#13613b;border:1px solid #87c9a4}
.fx{display:grid;grid-template-columns:1.3fr .9fr;gap:12px}
@media(max-width:1000px){.fx{grid-template-columns:1fr}}
.fg{display:grid;grid-template-columns:114px 1fr;gap:7px 10px;align-items:center}
.fg label{font-size:11px;font-weight:700;color:#2c3630;text-align:right}
.fg .ro,.fg input{background:#fff;border:1px solid #fff;border-top-color:#808478;border-left-color:#808478;
padding:5px 8px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:#101210;width:100%}
.fg .ro{background:#eceee9;color:#3a443e}
.fg input:focus{outline:2px solid #008080;outline-offset:-1px}
.sig{grid-column:1/-1;background:#fffbe8;border:1px solid #d8cf9a;padding:9px 11px;font-size:12.5px;margin-top:3px}
.sig b{display:block;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#7a6a20;margin-bottom:3px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:11px;border-top:1px solid #b4bab0}
.b{background:linear-gradient(180deg,#e8ebe5,#c8ccc4);border:2px solid #fff;border-right-color:#6e736a;
border-bottom-color:#6e736a;padding:7px 15px;font-size:12px;font-weight:700;color:#1b2420}
.b:hover{background:linear-gradient(180deg,#f4f6f2,#d8dcd4)}
.b.go{background:linear-gradient(180deg,#2fa36b,#1b7a4c);color:#fff;border-color:#64d3a0;border-right-color:#0e5533;border-bottom-color:#0e5533}
.b.no{background:linear-gradient(180deg,#d1465f,#a61632);color:#fff;border-color:#f09aab;border-right-color:#6e0c20;border-bottom-color:#6e0c20}
.ab{border:2px solid;padding:10px 12px;margin-top:10px;font-size:12.5px;line-height:1.6}
.ab.d{background:#fff4e3;border-color:#c07a16;color:#5e3a00}
.ab.r{background:#ffe9ed;border-color:#a61632;color:#6e0c20}
.ab.p{background:#e4f6ec;border-color:#1b7a4c;color:#0d4a2d}
.ab h4{font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:5px;font-weight:800}
.fk{background:#004f4f;color:#9fe8e8;font-family:'IBM Plex Mono',monospace;font-size:10.5px;
padding:5px 12px;display:flex;gap:16px;flex-wrap:wrap;flex:none}
.fk b{color:#fff}
.pcard{background:#fff;border:1px solid #969c92;padding:12px;font-size:12.5px}
.pcard h4{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#004f4f;font-weight:800;
margin-bottom:7px;border-bottom:1px solid #d2d6cf;padding-bottom:4px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12px}
.kv dt{color:#5a645e}.kv dd{font-family:'IBM Plex Mono',monospace;text-align:right}
.alrg{background:#ffd9df;border:2px solid #a61632;color:#6e0c20;padding:7px 11px;font-size:12px;font-weight:700;margin-bottom:10px}
/* ===== SYSTEM 2: MERIDIAN (clinical chart) ===== */
.me{background:#eef2f6;color:#0c1a26;min-height:100%;display:flex;flex-direction:column}
.met{background:linear-gradient(180deg,#123250,#0b2135);color:#dce8f2;display:flex;align-items:center;gap:13px;padding:0 14px;height:44px;flex:none}
.met b{font-size:15px;color:#fff}.met b span{color:#3fc0bd}
.mpt{display:flex;gap:1px;background:#081a2a;padding:0 10px;flex:none;overflow-x:auto}
.mpt button{padding:7px 14px;font-size:12px;color:#9fb8cc;border-bottom:3px solid transparent;white-space:nowrap}
.mpt button:hover{background:rgba(255,255,255,.07);color:#fff}
.mpt button.on{background:#eef2f6;color:#0c1a26;font-weight:700;border-bottom-color:#0f8b8d}
.mw{flex:1;display:flex;min-height:0}
.sto{width:232px;flex:none;background:linear-gradient(175deg,#123250,#0b2135);color:#cfe0ed;overflow-y:auto;padding-bottom:20px}
.sth{padding:14px;display:flex;gap:11px}
.pho{width:46px;height:46px;border-radius:4px;display:grid;place-items:center;font-weight:800;font-size:16px;color:#06212f}
.sth h1{font-size:14px;color:#fff;line-height:1.25;font-weight:700}
.sth .m{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#8fadc4;margin-top:3px}
.sec{border-top:1px solid rgba(255,255,255,.08);padding:10px 14px}
.sec h2{font-size:9px;letter-spacing:.17em;text-transform:uppercase;color:#6f90a9;margin-bottom:6px;font-weight:700}
.row{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;padding:2px 0}
.row span:first-child{color:#8fadc4}.row span:last-child{color:#eaf3fa;text-align:right;font-weight:500}
.alb{background:#fdf3df;border-left:4px solid #b87503;color:#3d2a00;margin:9px 11px;padding:8px 10px;border-radius:3px}
.alb h3{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:#b87503;font-weight:800}
.alb li{list-style:none;font-size:11.5px;font-weight:700;margin-top:4px;line-height:1.4}
.alb li em{font-weight:400;font-style:normal;color:#6a5120;display:block;font-size:10.5px}
.wk{flex:1;overflow-y:auto;min-width:0}
.at{display:flex;gap:2px;background:#fff;border-bottom:1px solid #d5dee6;padding:0 12px;position:sticky;top:0;z-index:4;overflow-x:auto}
.at button{padding:10px 13px 8px;font-size:12px;color:#44596b;border-bottom:3px solid transparent;white-space:nowrap}
.at button:hover{color:#0a6b6d}
.at button.on{color:#0a6b6d;border-bottom-color:#0f8b8d;font-weight:700}
.pane{padding:14px}
.mc{background:#fff;border:1px solid #d5dee6;border-radius:3px;box-shadow:0 1px 2px rgba(10,28,44,.08);margin-bottom:13px;overflow:hidden}
.mc>header{display:flex;align-items:center;gap:9px;padding:8px 12px;border-bottom:1px solid #e8eef3;background:linear-gradient(180deg,#fbfdfe,#f3f7fa)}
.mc>header h3{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:#15395a;font-weight:800}
.rt{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:11px;color:#78909c}
.mb{padding:12px}.mb.fl{padding:0}
table.m{width:100%;border-collapse:collapse}
table.m th{text-align:left;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:#78909c;
font-weight:700;padding:7px 11px;border-bottom:1px solid #d5dee6;background:#f7fafc}
table.m td{padding:7px 11px;border-bottom:1px solid #eef3f7;font-size:12.5px;vertical-align:top}
table.m tbody tr:hover{background:#f6fbfb}
.n{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;text-align:right}
.cp{display:inline-block;padding:1.5px 7px;border-radius:10px;font-size:10px;font-weight:800;white-space:nowrap}
.ch1{background:var(--wnb);color:var(--wn);border:1px solid #e9c268}
.cl1{background:var(--infb);color:var(--inf);border:1px solid #b9d2ef}
.co1{background:var(--okb);color:var(--ok);border:1px solid #b6ddc7}
.cn1{background:#eef2f6;color:#44596b;border:1px solid #d5dee6}
.ct1{background:#e4f3f3;color:#0a6b6d;border:1px solid #a9dcdc}
.med{border-bottom:1px solid #eef3f7;padding:10px 12px}
.med:last-child{border-bottom:0}
.med .mn{font-weight:700;font-size:13px}
.med .mg{font-size:12px;color:#44596b;margin-top:1px}

const items=s=>TASKS[s].sets.flatMap(x=>x.items);
function setP(s,k){const st=TASKS[s].sets.find(x=>x.k===k);
 return{d:st.items.filter(i=>S.res[i.id]&&S.res[i.id].ok).length,t:st.items.length};}
function sysP(s){const it=items(s);return{d:it.filter(i=>S.res[i.id]&&S.res[i.id].ok).length,t:it.length};}
function totP(){let d=0,t=0;["rx","me"].forEach(s=>{const p=sysP(s);d+=p.d;t+=p.t;});return{d,t};}
const nrm=s=>String(s).toLowerCase().trim().replace(/[.,;:!?]+$/,"").replace(/\s+/g," ");
const flg=(v,lo,hi)=>v>hi?{c:"ch1",l:"HIGH",x:"#b87503"}:v<lo?{c:"cl1",l:"LOW",x:"#1a4e8f"}:{c:"co1",l:"WNL",x:"#1f7a4d"};
function tick(){const d=new Date(),e=$("#clk");if(e)e.textContent=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}
setInterval(tick,10000);

   ${Object.entries({Temperature:p.vit.t,"Heart rate":p.vit.hr,"Blood pressure":p.vit.bp,Respirations:p.vit.rr,"Oxygen saturation":p.vit.o2,Weight:p.wt})
    .map(([k,v])=>`<tr><td>${k}</td><td class="n">${v}</td></tr>`).join("")}</tbody></table></div></div>`;
 }else if(S.me.tab==="mar"){
  pane=`<div class="mc"><header><h3>Medication Administration Record</h3><span class="rt">Click a DUE dose to document</span></header>
   <div class="mb fl">${p.meds.map((m,i)=>`<div class="med"><div class="mn">${esc(m.n)}</div>
    <div class="mg">${esc(m.s)}</div><div class="mi2">Indication: ${esc(m.i)}</div>
    <div class="ds">${m.d.length?m.d.map((d,j)=>{const k=d.s.startsWith("Given")?"gv":d.s.startsWith("Held")?"hd":"du";
     return k==="du"?`<button class="d1 du" data-dose="${i}-${j}"><span class="t">${d.t}</span>Due — document</button>`
      :`<div class="d1 ${k}"><span class="t">${d.t}</span>${esc(d.s)}</div>`;}).join("")
     :`<div class="d1"><span class="t">—</span>No doses scheduled</div>`}</div></div>`).join("")}</div></div>`;
 }else if(S.me.tab==="results"){
  pane=`<div class="mc"><header><h3>Laboratory Results</h3><span class="rt">Collected today 05:12</span></header><div class="mb fl">
   <table class="m"><thead><tr><th>Component</th><th class="n">Result</th><th>Units</th><th>Reference</th><th style="text-align:right">Flag</th></tr></thead>
   <tbody>${p.labs.map(l=>{const f=flg(l.v,l.lo,l.hi);
    return `<tr><td>${esc(l.n)}</td><td class="n" style="color:${f.x};font-weight:700">${l.v}</td>
    <td style="color:#78909c;font-size:11.5px">${esc(l.u)}</td><td class="n" style="color:#78909c;font-size:11.5px">${l.lo} – ${l.hi}</td>
    <td style="text-align:right"><span class="cp ${f.c}">${f.l}</span></td></tr>`;}).join("")}</tbody></table></div></div>`;
 }else if(S.me.tab==="vitals"){
  pane=`<div class="mc"><header><h3>Vital Signs &amp; Measurements</h3></header><div class="mb fl"><table class="m"><tbody>
   ${Object.entries({Temperature:p.vit.t,"Heart rate":p.vit.hr,"Blood pressure":p.vit.bp,"Respiratory rate":p.vit.rr,"SpO₂":p.vit.o2,
    Weight:p.wt,Height:p.ht,"Serum creatinine":p.scr+" mg/dL",Age:p.age+" years",Sex:p.sex})
    .map(([k,v])=>`<tr><td>${k}</td><td class="n">${v}</td></tr>`).join("")}</tbody></table></div></div>
   <div class="mc"><header><h3>Renal Dosing Reference</h3></header><div class="mb" style="line-height:1.75">
   <b>Cockcroft-Gault:</b> CrCl (mL/min) = [(140 − age) × weight in kg] ÷ (72 × serum creatinine)<br>
   Multiply by 0.85 for female patients.<br>
   <span style="color:#78909c;font-size:12px">This patient: age ${p.age}, weight ${p.wt}, SCr ${p.scr} mg/dL, sex ${p.sex}.</span></div></div>`;
 }else if(S.me.tab==="notes"){
  pane=`<div class="mc"><header><h3>Clinical Notes</h3><span class="rt">${p.notes.length} document(s)</span></header><div class="mb fl">
   ${p.notes.map((n,i)=>`<div class="nt ${i===0?"op":""}"><button class="nth" data-note="${i}">
    <div style="flex:1"><strong>${esc(n.ty)}</strong><span>${esc(n.au)} · ${n.dt}</span></div>
    <span class="cp co1">Signed</span></button><div class="ntb">${esc(n.b)}</div></div>`).join("")}</div></div>`;
 }else{
  pane=`<div class="mc"><header><h3>Medication Order Entry</h3><span class="rt">Pharmacist verification required</span></header><div class="mb">
   <div class="ob"><div class="o2">
    <div><label for="oD">Medication</label><input id="oD" type="text" placeholder="e.g. albuterol nebulized"></div>
    <div><label for="oS">Dose &amp; route</label><input id="oS" type="text" placeholder="e.g. 2.5 mg NEB"></div></div>
   <div class="o2"><div><label for="oF">Frequency</label><select id="oF"><option value="">— select —</option>
    <option>once</option><option>q4h</option><option>q6h</option><option>q8h</option><option>q12h</option><option>daily</option><option>BID</option><option>PRN</option></select></div>
    <div><label for="oI">Indication (required)</label><input id="oI" type="text" placeholder="e.g. bronchospasm"></div></div>
   <div style="display:flex;gap:9px;margin-top:4px"><button class="bt" id="oGo">Submit Order for Verification</button>
    <button class="bg2" id="oCl">Clear</button></div>
   ${S.me.ord?`<div class="ab ${S.me.ord.ok?"p":"r"}" style="margin-top:12px"><h4>${S.me.ord.ok?"Order Accepted":"Order Rejected"}</h4>${esc(S.me.ord.m)}</div>`:""}
   <p class="note" style="color:#78909c">Weight on file: <b>${p.wt}</b>. Orders are range-checked against documented weight and will be rejected if a required field is blank.</p></div></div></div>`;
 }
 return `<div class="me"><div class="met"><b>Meridian<span>Health</span></b>
  <span style="font-size:11.5px;color:#8fadc4">Inpatient Chart · Pharmacy View</span>
  <span class="mono" style="margin-left:auto;font-size:11px;color:#8fadc4">USER: ${esc(S.ini)} · PHARM</span></div>
 <div class="mpt">${Object.entries(ME).map(([k,v])=>`<button class="${k===S.me.pid?"on":""}" data-mp="${k}">${esc(v.name.split(",")[0])} · ${v.room}</button>`).join("")}</div>
 <div class="mw"><aside class="sto">
  <div class="sth"><div class="pho" style="background:${p.hue}">${p.ini}</div>
   <div><h1>${esc(p.name)}</h1><div class="m">${p.age} y · ${p.sex} · ${p.dob}</div><div class="m">MRN ${p.mrn}</div></div></div>
  <div class="sec"><div class="row"><span>Location</span><span>${p.room}</span></div>
   <div class="row"><span>Unit</span><span>${esc(p.unit)}</span></div>
   <div class="row"><span>LOS</span><span>${p.los}</span></div>
   <div class="row"><span>Attending</span><span>${esc(p.att)}</span></div></div>
  <div class="alb"><h3>⚠ Allergies</h3>${p.alrg.map(a=>`<li>${esc(a.a)}<em>${esc(a.r)}</em></li>`).join("")}</div>
  <div class="sec"><h2>Code Status</h2><span class="cp co1">${esc(p.code)}</span></div>
  <div class="sec"><h2>Measurements</h2>
   <div class="row"><span>Weight</span><span>${p.wt}</span></div>
   <div class="row"><span>Height</span><span>${p.ht}</span></div>
   <div class="row"><span>Serum Cr</span><span>${p.scr} mg/dL</span></div></div>
  <div class="sec"><h2>Diet</h2><div style="font-size:11.5px;color:#eaf3fa">${esc(p.diet)}</div></div></aside>
  <div class="wk"><div class="at">${MT.map(([k,l])=>`<button class="${k===S.me.tab?"on":""}" data-mt="${k}">${l}</button>`).join("")}</div>
  <div class="pane">${pane}</div></div></div></div>`;}

/* ---- certificate ---- */
function code(){const tp=totP();let h=0;const s=S.user+"|"+tp.d+"|"+new Date().toDateString();
 for(let i=0;i<s.length;i++)h=((h<<5)-h+s.charCodeAt(i))|0;
 return "LUCOP-"+Math.abs(h).toString(36).toUpperCase().padStart(7,"0").slice(0,7)+"-"+tp.d;}
function vCert(){const tp=totP(),pc=tp.t?Math.round(tp.d/tp.t*100):0;
 const d=new Date().toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"});
 const rows=["rx","me"].flatMap(s=>TASKS[s].sets.map(x=>{const p=setP(s,x.k);
  return{l:META[s].name.split(" ")[0]+" · "+x.name,d:p.d,t:p.t};}));
 const weak=rows.filter(r=>r.d<r.t).sort((a,b)=>(a.d/a.t)-(b.d/b.t)).slice(0,3);
 return `<div class="cw"><div><div class="ct">
 <div class="ctm">LU</div><div class="ey">Loyola University · College of Pharmacy</div>
 <h1>Certificate of Completion</h1>
 <div class="nmx">${esc(S.user||"Student Pharmacist")}</div>
 <p class="sb2">has completed guided practice in the LUCOP Pharmacy Playground, working through simulated community dispensing and inpatient chart review systems in preparation for introductory pharmacy practice experiences.</p>
 <div class="cs"><div><b>${tp.d}</b><span>Tasks completed</span></div><div><b>${tp.t}</b><span>Tasks available</span></div>
  <div><b>${pc}%</b><span>Overall score</span></div></div>
 <div class="brk"><h4>Performance by task set</h4>
  ${rows.map(r=>`<div class="br"><span class="l">${esc(r.l)}</span>
   <span class="tr"><i style="width:${Math.round(r.d/r.t*100)}%"></i></span><span class="sc">${r.d}/${r.t}</span></div>`).join("")}</div>
 ${weak.length?`<div class="brk"><h4>Suggested review before rotation</h4>
  <p style="font-size:12.5px;color:#3f3310;line-height:1.7">${weak.map(w=>esc(w.l)).join(" · ")}</p></div>`
  :`<div class="brk"><h4>Result</h4><p style="font-size:12.5px;color:#3f3310">All task sets completed. Nicely done.</p></div>`}
 <div class="cf"><div>Completed <b>${d}</b><br>Signed on as <b>${esc(S.ini)}</b></div>
  <div style="text-align:right">Verification code<br><span class="cd">${code()}</span></div></div>
 <p class="cnt">This certificate documents completion of a simulated training exercise using fictitious patient data. It is not a clinical credential, licensure, or continuing education credit.</p>
 </div><div class="cac"><button class="tbtn" id="cP" style="padding:11px 20px;font-size:13px">🖨 Print / Save as PDF</button>
 <button class="tbtn" id="cB" style="padding:11px 20px;font-size:13px">‹ Back to Systems</button></div></div></div>`;}

/* ============ RENDER ============ */
function render(){
 const sc=$("#scr"),signed=S.screen!=="login";
 ["bCert","bReset","tbU"].forEach(i=>$("#"+i).classList.toggle("hide",!signed));
 $("#bLob").classList.toggle("hide",!(signed&&S.screen!=="lobby"));
 $("#tbSys").classList.toggle("hide",S.screen!=="mod");
 if(signed){$("#tbAv").textContent=S.ini;$("#tbN").textContent=S.user.split(" ")[0];$("#tbU").style.display="flex";}
 if(S.screen==="mod")$("#tbSysN").textContent=META[S.sys].name;
 if(S.screen==="login"){sc.innerHTML=vLogin();bLogin();}
 else if(S.screen==="lobby"){sc.innerHTML=vLobby();document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{
   S.sys=b.dataset.open;S.screen="mod";S.setKey=null;S.tIdx=0;S.fb=null;S.pick=null;S.hint=false;render();});}
 else if(S.screen==="cert"){sc.innerHTML=vCert();$("#cP").onclick=()=>window.print();$("#cB").onclick=()=>{S.screen="lobby";render();};}
 else{sc.innerHTML=`<div class="win"><div class="wbar"><div class="dots">
   <i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
   <span class="wtt">${esc(META[S.sys].name)} — Workstation 04 — ${esc(S.ini)}</span></div>
   <div class="wbody"><div class="app">${S.sys==="rx"?vRx():vMe()}</div>${vPC()}</div></div>`;bMod();}
 tick();
}
function bLogin(){const go=()=>{const n=$("#iN").value.trim(),i=$("#iI").value.trim().toUpperCase();
 if(!n){$("#iN").focus();return;}
 S.user=n;S.ini=i||n.split(" ").map(x=>x[0]).join("").slice(0,3).toUpperCase();S.screen="lobby";render();};
 $("#goL").onclick=go;$("#iI").onkeydown=e=>{if(e.key==="Enter")go();};
 $("#iN").onkeydown=e=>{if(e.key==="Enter")$("#iI").focus();};$("#iN").focus();}

function bMod(){
 const t=$("#pcT");if(t)t.onclick=()=>{S.pcOpen=!S.pcOpen;render();};
 document.querySelectorAll("[data-set]").forEach(b=>b.onclick=()=>{S.setKey=b.dataset.set;S.tIdx=0;S.fb=null;S.pick=null;S.hint=false;render();});
 const bk=$("#bk");if(bk)bk.onclick=()=>{S.setKey=null;S.fb=null;render();};
 document.querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>{S.pick=+b.dataset.ch;S.fb=null;render();});
 const bC=$("#bC");if(bC)bC.onclick=chk;
 const bH=$("#bH");if(bH)bH.onclick=()=>{S.hint=true;S.fb=null;render();};
 const tN=$("#tN");if(tN)tN.onclick=()=>{const st=TASKS[S.sys].sets.find(x=>x.k===S.setKey);
  if(S.tIdx<st.items.length-1){S.tIdx++;S.fb=null;S.pick=null;S.hint=false;}else{S.setKey=null;S.fb=null;}render();};
 const tP=$("#tP");if(tP)tP.onclick=()=>{if(S.tIdx>0){S.tIdx--;S.fb=null;S.pick=null;S.hint=false;render();}};
 const rS=$("#rS");if(rS)rS.onclick=()=>{const st=TASKS[S.sys].sets.find(x=>x.k===S.setKey);
  st.items.forEach(i=>delete S.res[i.id]);S.tIdx=0;S.fb=null;S.pick=null;S.hint=false;render();};
 const tA=$("#tA");if(tA)tA.onkeydown=e=>{if(e.key==="Enter")chk();};
 if(S.sys==="rx")bRx();else bMe();
}
function chk(){
 const st=TASKS[S.sys].sets.find(x=>x.k===S.setKey);if(!st)return;
 const it=st.items[S.tIdx];let ok=false;
 if(it.t==="judg"){if(S.pick===null){S.fb={k:"h",h:"Select an option",m:"Choose one of the answers above, then press Check Answer.",w:""};render();return;}
  ok=S.pick===it.ans;}
 else if(it.t==="calc"){const raw=($("#tA")||{}).value||"";const n=parseFloat(String(raw).replace(/[^0-9.\-]/g,""));
  if(isNaN(n)){S.fb={k:"h",h:"Enter a number",m:"This task expects a numeric answer.",w:""};render();return;}
  ok=Math.abs(n-it.a)<=(it.tol||0);}
 else{const raw=($("#tA")||{}).value||"";
  if(!raw.trim()){S.fb={k:"h",h:"Enter an answer",m:"Type your answer in the box, then press Check Answer.",w:""};render();return;}
  ok=it.a.some(a=>nrm(raw).includes(nrm(a)));}
 const pv=S.res[it.id]||{n:0};S.res[it.id]={ok:ok||pv.ok,n:pv.n+1};
 if(ok)S.fb={k:"g",h:"Correct",m:"",w:it.w};
 else{const n=S.res[it.id].n;
  S.fb={k:"b",h:"Not quite",m:n>=2?"Try again — here is a hint: "+it.h:"Take another look in the system on the left, then try again.",w:""};
  if(n>=2)S.hint=true;}
 render();
}
function bRx(){
 document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{S.rx={view:"queue",sel:null,sigOut:"",dur:null,adj:null,msg:""};render();});
 document.querySelectorAll("[data-rx]").forEach(r=>r.onclick=()=>{S.rx={view:"entry",sel:r.dataset.rx,sigOut:"",dur:null,adj:null,msg:""};render();});
 document.querySelectorAll("[data-pt]").forEach(r=>r.onclick=()=>{S.rx.sel=r.dataset.pt;S.rx.view="prof";render();});
 const b2=$("#bk2");if(b2)b2.onclick=()=>{S.rx.view="queue";render();};
 const bp=$("#bPr");if(bp)bp.onclick=()=>{const r=S.q.find(x=>x.id===S.rx.sel);S.rx.sel=r.pid;S.rx.view="prof";render();};
 const bs=$("#bSig");if(bs)bs.onclick=()=>{S.rx.sigOut=xlat($("#fG").value)||"Unable to interpret — check your shorthand.";render();};
 const bd=$("#bDur");if(bd)bd.onclick=()=>{const r=S.q.find(x=>x.id===S.rx.sel);let m=[];
  if(r.iss==="allergy")m.push("<b>SEVERITY 1 — ALLERGY MATCH.</b> Patient has a documented sulfa allergy on file (rash, 2008). The prescribed agent sulfamethoxazole-trimethoprim is a sulfonamide antimicrobial. Do not dispense without prescriber contact.");
  if(r.iss==="nsaid")m.push("<b>SEVERITY 2 — DRUG INTERACTION.</b> Ibuprofen with apixaban: additive bleeding risk.<br><b>SEVERITY 2 — DISEASE INTERACTION.</b> NSAID use in CKD stage 3b: risk of further renal decline and fluid retention.");
  if(r.iss==="cii")m.push("<b>CONTROLLED SUBSTANCE — CII.</b> No refills permitted. Prior fill 09/26/2026, 20-day supply, exhausted 10/16/2026. PDMP review required before dispensing.");
  if(r.iss==="rts")m.push("<b>THERAPY CHANGE DETECTED.</b> Prior fill was levothyroxine 75 mcg on 09/18/2026. This prescription is 88 mcg — a strength change, not a duplicate refill.");
  if(!m.length)m.push("No clinically significant DUR findings. Profile reviewed against the full active medication list.");
  S.rx.dur=m.join("<br><br>");render();};
 const ba=$("#bAdj");if(ba)ba.onclick=()=>{const r=S.q.find(x=>x.id===S.rx.sel);
  if(r.rej==="79")S.rx.adj={ok:false,m:"<b>REJECTED — CODE 79: REFILL TOO SOON.</b><br>Plan reports a previous fill of this therapy on 09/18/2026 for a 30-day supply. Next eligible fill date 10/18/2026.<br><i>Pharmacist review required — check whether the strength or directions have changed.</i>"};
  else S.rx.adj={ok:true,m:"<b>PAID.</b> Claim accepted. Patient pay amount $"+r.cp.toFixed(2)+". Ingredient cost $"+r.pz.toFixed(2)+". No plan edits returned."};
  render();};
 const bf=$("#bFill");if(bf)bf.onclick=()=>{const r=S.q.find(x=>x.id===S.rx.sel);
  if(!$("#fS").value.trim()){S.rx.msg="⚠ Day supply is required before this prescription can be filled.";render();return;}
  if(r.iss==="allergy"){S.rx.msg="⚠ HARD STOP — a documented allergy match cannot be overridden at entry without prescriber contact. Use Call Prescriber or Return to Prescriber.";render();return;}
  r.dsup=$("#fS").value.trim();r.st="Filled";
  S.rx.msg="✓ Prescription "+r.id+" verified and filled by "+S.ini+". Label printed, moved to will-call.";render();};
 const br=$("#bRej");if(br)br.onclick=()=>{const r=S.q.find(x=>x.id===S.rx.sel);r.st="Hold";
  S.rx.msg="Prescription returned to prescriber with a clinical note. Status set to Hold pending response.";render();};
 const bc=$("#bCall");if(bc)bc.onclick=()=>{const r=S.q.find(x=>x.id===S.rx.sel);
  S.rx.msg="☎ Call logged to "+r.pr+". Document the recommendation made, the response received, and any change authorized — a verbal change is only valid once written into the record.";render();};
}
function bMe(){
 document.querySelectorAll("[data-mp]").forEach(b=>b.onclick=()=>{S.me.pid=b.dataset.mp;S.me.ord=null;render();});
 document.querySelectorAll("[data-mt]").forEach(b=>b.onclick=()=>{S.me.tab=b.dataset.mt;render();});
 document.querySelectorAll("[data-note]").forEach(b=>b.onclick=()=>b.parentElement.classList.toggle("op"));
 document.querySelectorAll("[data-dose]").forEach(b=>b.onclick=()=>{
  const[i,j]=b.dataset.dose.split("-").map(Number),d=new Date();
  ME[S.me.pid].meds[i].d[j].s="Given — "+S.ini+" @ "+String(d.getHours()).padStart(2,"0")+String(d.getMinutes()).padStart(2,"0");
  render();});
 const og=$("#oGo");if(og)og.onclick=()=>{
  const d=$("#oD").value.trim(),s=$("#oS").value.trim(),f=$("#oF").value,i=$("#oI").value.trim();
  S.me.ord=(!d||!s||!f||!i)
   ?{ok:false,m:"Order incomplete. Medication, dose and route, frequency, and indication are all required. Structured order entry exists specifically to prevent the ambiguity that free-text orders create."}
   :{ok:true,m:`Order accepted and routed to pharmacy for verification: ${d} ${s} ${f} — indication: ${i}. Range check passed against documented weight ${ME[S.me.pid].wt}. Entered by ${S.ini}.`};
  render();};
 const oc=$("#oCl");if(oc)oc.onclick=()=>{S.me.ord=null;render();};
}
/* taskbar */
const SNAP=JSON.stringify(ME);
$("#bLob").onclick=()=>{S.screen="lobby";render();};
$("#bCert").onclick=()=>{S.screen="cert";render();};
$("#bReset").onclick=()=>{
 if(!confirm("Reset the entire playground?\n\nThis clears all task progress, restores every prescription in the queue, un-documents all medication doses, and returns both systems to their starting state.\n\nYour name and sign-on are kept."))return;
 S.res={};S.setKey=null;S.tIdx=0;S.fb=null;S.pick=null;S.hint=false;
 S.q=JSON.parse(JSON.stringify(Q0));
 const sn=JSON.parse(SNAP);Object.keys(sn).forEach(k=>ME[k]=sn[k]);
 S.rx={view:"queue",sel:null,sigOut:"",dur:null,adj:null,msg:""};
 S.me={pid:"m1",tab:"summary",ord:null};
 S.screen="lobby";render();};
S.q=JSON.parse(JSON.stringify(Q0));
render();
</script>
